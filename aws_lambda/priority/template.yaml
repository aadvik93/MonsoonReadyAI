AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Simple Lambda for MonsoonReady AI risk scoring

Resources:
  PriorityFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      Runtime: python3.11
      CodeUri: .
      Description: Compute flood‑risk priority from report data
      MemorySize: 128
      Timeout: 3
